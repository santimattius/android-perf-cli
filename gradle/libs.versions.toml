[versions]
kotlin = "2.1.0"
clikt = "4.4.0"
mordant = "2.7.2"
shark = "2.2"
coroutines = "1.8.1"
kotlinx-serialization = "1.7.3"
graalvm-native = "0.10.4"
agp = "8.6.1"
compose-bom = "2024.09.00"
androidx-core-ktx = "1.13.1"
androidx-activity = "1.9.3"
androidx-work = "2.9.1"
okhttp = "4.12.0"

[libraries]
clikt = { module = "com.github.ajalt.clikt:clikt", version.ref = "clikt" }
mordant = { module = "com.github.ajalt.mordant:mordant", version.ref = "mordant" }
mordant-coroutines = { module = "com.github.ajalt.mordant:mordant-coroutines", version.ref = "mordant" }

shark-hprof = { module = "com.squareup.leakcanary:shark-hprof", version.ref = "shark" }
shark-graph = { module = "com.squareup.leakcanary:shark-graph", version.ref = "shark" }
shark = { module = "com.squareup.leakcanary:shark", version.ref = "shark" }
shark-android = { module = "com.squareup.leakcanary:shark-android", version.ref = "shark" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "kotlin" }

# Compose — BOM-managed (no version on sub-artifacts)
compose-bom                = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-ui                 = { group = "androidx.compose.ui", name = "ui" }
compose-material3          = { group = "androidx.compose.material3", name = "material3" }
compose-foundation         = { group = "androidx.compose.foundation", name = "foundation" }
compose-activity           = { group = "androidx.activity", name = "activity-compose", version.ref = "androidx-activity" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }

# Android base
androidx-core-ktx         = { group = "androidx.core",     name = "core-ktx",        version.ref = "androidx-core-ktx" }
androidx-activity-ktx     = { group = "androidx.activity", name = "activity-ktx",     version.ref = "androidx-activity" }
androidx-work-runtime-ktx = { group = "androidx.work",     name = "work-runtime-ktx", version.ref = "androidx-work" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }

[plugins]
kotlin-jvm           = { id = "org.jetbrains.kotlin.jvm",                    version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization",   version.ref = "kotlin" }
graalvm-native       = { id = "org.graalvm.buildtools.native",               version.ref = "graalvm-native" }
android-application  = { id = "com.android.application",                     version.ref = "agp" }
kotlin-android       = { id = "org.jetbrains.kotlin.android",                version.ref = "kotlin" }
kotlin-compose       = { id = "org.jetbrains.kotlin.plugin.compose",         version.ref = "kotlin" }
